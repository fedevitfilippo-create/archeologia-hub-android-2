          js = r"""

          /* =================================================
             ARCHEOLOGIA HUB V30

             CENTRO STUDIO COMPLETAMENTE INDIPENDENTE

             NON USA:

             go()
             hubExamId
             v13OpenSelected()
             pagina esami
             router esami

             ================================================= */


          (function(){

            "use strict";


            var state = {

