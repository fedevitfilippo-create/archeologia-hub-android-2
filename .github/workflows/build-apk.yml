name: Build Archeologia Hub V31

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:

    name: Compila Archeologia Hub V31

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # JAVA
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # GRADLE
      # =========================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # =========================================================
      # TROVA ARCHIVIO
      # =========================================================

      - name: Trova archivio Archeologia Hub
        shell: bash
        run: |
          set -e

          ZIP="Archeologia_Hub_V22_PREMIUM_UI.zip"

          echo "Controllo archivio..."

          if [ ! -f "$ZIP" ]; then
            echo "ERRORE: archivio non trovato."
            echo "File disponibili:"
            ls -lah
            exit 1
          fi

          echo "Archivio trovato:"
          ls -lh "$ZIP"


      # =========================================================
      # ESTRAZIONE
      # =========================================================

      - name: Estrai progetto Android
        shell: bash
        run: |
          set -e

          rm -rf ArcheologiaHubAndroid

          unzip -q -o \
            Archeologia_Hub_V22_PREMIUM_UI.zip

          test -d ArcheologiaHubAndroid

          test -f \
            ArcheologiaHubAndroid/app/build.gradle

          test -f \
            ArcheologiaHubAndroid/app/src/main/assets/index.html

          echo "Progetto Android estratto correttamente."


      # =========================================================
      # CENTRO STUDIO V31
      # COMPLETAMENTE SEPARATO DAGLI ESAMI
      # =========================================================

      - name: Crea Centro Studio V31
        shell: bash
        run: |
          set -e

          HTML="ArcheologiaHubAndroid/app/src/main/assets/index.html"

          cp "$HTML" /tmp/index-original.html

          mkdir -p /tmp/studio-v31

          cat > /tmp/studio-v31/studio.css <<'CSS'

          /* =====================================================
             ARCHEOLOGIA HUB V31
             CENTRO STUDIO ISOLATO
             ===================================================== */

          #arch-studio-v31 {

            position: fixed !important;

            inset: 0 !important;

            width: 100vw !important;
            height: 100vh !important;

            z-index: 2147483647 !important;

            display: none;

            overflow: hidden;

            background: #efe5d5;

            color: #2d241c;

            font-family: inherit;

            isolation: isolate;

          }


          #arch-studio-v31.arch-studio-open {

            display: block !important;

          }


          #arch-studio-v31 * {

            box-sizing: border-box;

          }


          #arch-studio-v31 button {

            font-family: inherit;

            touch-action: manipulation;

            -webkit-tap-highlight-color: transparent;

          }


          #arch-studio-v31 .studio-header {

            height: 72px;

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 10px 14px;

            background:
              linear-gradient(
                135deg,
                #34251b,
                #714b2c
              );

            color: white;

          }


          #arch-studio-v31 .studio-back {

            width: 46px;
            height: 46px;

            border: 0;

            border-radius: 50%;

            background: rgba(255,255,255,.16);

            color: white;

            font-size: 25px;

            cursor: pointer;

          }


          #arch-studio-v31 .studio-title {

            flex: 1;

            min-width: 0;

          }


          #arch-studio-v31 .studio-title small {

            display: block;

            font-size: 9px;

            letter-spacing: .15em;

            opacity: .7;

            font-weight: 800;

          }


          #arch-studio-v31 .studio-title strong {

            display: block;

            margin-top: 3px;

            font-size: 20px;

          }


          #arch-studio-v31 .studio-badge {

            padding: 8px 10px;

            border-radius: 999px;

            background: #d39a58;

            color: #2d2118;

            font-size: 9px;

            font-weight: 900;

          }


          #arch-studio-v31 .studio-body {

            height: calc(100vh - 72px);

            overflow-y: auto;

            padding: 15px;

            -webkit-overflow-scrolling: touch;

          }


          #arch-studio-v31 .studio-hero {

            padding: 20px;

            margin-bottom: 14px;

            border-radius: 22px;

            background:
              linear-gradient(
                145deg,
                #fffaf2,
                #dfc9a9
              );

            border: 1px solid rgba(70,45,25,.14);

          }


          #arch-studio-v31 .studio-hero h2 {

            margin: 0 0 7px;

            font-size: 27px;

          }


          #arch-studio-v31 .studio-hero p {

            margin: 0;

            line-height: 1.5;

            color: #705a45;

          }


          #arch-studio-v31 .studio-grid {

            display: grid;

            grid-template-columns:
              repeat(2,minmax(0,1fr));

            gap: 11px;

          }


          #arch-studio-v31 .studio-card {

            min-height: 120px;

            padding: 16px;

            border: 1px solid rgba(70,45,25,.13);

            border-radius: 18px;

            background: #fffaf3;

            color: #30251c;

            text-align: left;

            cursor: pointer;

            box-shadow:
              0 4px 14px rgba(60,40,20,.06);

          }


          #arch-studio-v31 .studio-card:active {

            transform: scale(.98);

          }


          #arch-studio-v31 .studio-icon {

            display: block;

            font-size: 28px;

          }


          #arch-studio-v31 .studio-card strong {

            display: block;

            margin-top: 9px;

            font-size: 15px;

          }


          #arch-studio-v31 .studio-card span {

            display: block;

            margin-top: 4px;

            color: #806d59;

            font-size: 12px;

          }


          #arch-studio-v31 .studio-panel {

            display: none;

            margin-top: 14px;

            padding: 18px;

            border-radius: 18px;

            background: #fffaf3;

            border: 1px solid rgba(70,45,25,.13);

          }


          #arch-studio-v31 .studio-panel.active {

            display: block;

          }


          #arch-studio-v31 .studio-panel h3 {

            margin: 0 0 14px;

            font-size: 21px;

          }


          #arch-studio-v31 .studio-button {

            width: 100%;

            min-height: 46px;

            margin-top: 9px;

            padding: 12px;

            border: 0;

            border-radius: 12px;

            background: #87572b;

            color: white;

            font-weight: 800;

            cursor: pointer;

          }


          #arch-studio-v31 .studio-secondary {

            background: #f1e4d1;

            color: #34291f;

            border: 1px solid rgba(70,45,25,.12);

          }


          #arch-studio-v31 textarea {

            width: 100%;

            min-height: 180px;

            padding: 13px;

            border-radius: 12px;

            border: 1px solid rgba(70,45,25,.18);

            background: white;

            color: #2d241c;

            font: inherit;

            resize: vertical;

          }


          #arch-studio-v31 .flashcard {

            min-height: 230px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 25px;

            border-radius: 20px;

            background:
              linear-gradient(
                145deg,
                #ead8bd,
                #fff9ee
              );

            cursor: pointer;

          }


          #arch-studio-v31 .flashcard strong {

            font-size: 25px;

            line-height: 1.35;

          }


          #arch-studio-v31 .flashcard small {

            margin-top: 18px;

            color: #806d59;

          }


          #arch-studio-v31 .quiz-question {

            padding: 16px;

            border-radius: 14px;

            background: #f2e7d7;

            line-height: 1.45;

            font-weight: 800;

          }


          #arch-studio-v31 .quiz-option {

            width: 100%;

            margin-top: 9px;

            padding: 13px;

            border-radius: 12px;

            border: 1px solid rgba(70,45,25,.14);

            background: #f7eee1;

            color: #34291f;

            text-align: left;

            font-weight: 700;

            cursor: pointer;

          }


          #arch-studio-v31 .timer {

            text-align: center;

            font-size: 56px;

            font-weight: 900;

            color: #71471f;

            margin: 20px 0;

          }


          #arch-studio-v31 .stat {

            display: flex;

            justify-content: space-between;

            padding: 13px;

            margin-top: 8px;

            border-radius: 12px;

            background: #f5eadb;

          }


          @media(max-width:420px) {

            #arch-studio-v31 .studio-body {

              padding: 12px;

            }

            #arch-studio-v31 .studio-title strong {

              font-size: 18px;

            }

            #arch-studio-v31 .studio-badge {

              font-size: 8px;

              padding: 7px 8px;

            }

          }

          CSS


          cat > /tmp/studio-v31.js <<'JS'

          /* =====================================================
             ARCHEOLOGIA HUB V31
             MOTORE CENTRO STUDIO
             COMPLETAMENTE INDIPENDENTE DAGLI ESAMI
             ===================================================== */

          (function () {

            "use strict";


            var ROOT_ID = "arch-studio-v31";

            var state = {

              flash: 0,

              flashBack: false,

              quiz: 0,

              score: 0,

              seconds: 1500,

              timer: null

            };


            var FLASHCARDS = [

              [
                "Che cos'è la stratigrafia?",
                "Lo studio della successione degli strati archeologici e dei rapporti tra le unità stratigrafiche."
              ],

              [
                "Che cos'è una US?",
                "Unità Stratigrafica: una singola evidenza stratigrafica riconoscibile e documentabile."
              ],

              [
                "Che cos'è la tipologia?",
                "Un metodo di classificazione degli oggetti sulla base di caratteristiche condivise."
              ],

              [
                "Che cos'è la cultura materiale?",
                "L'insieme degli oggetti e delle evidenze materiali prodotti, utilizzati e trasformati dalle società."
              ]

            ];


            var QUIZ = [

              {

                q: "Quale disciplina studia la successione degli strati archeologici?",

                a: [

                  "Stratigrafia",

                  "Numismatica",

                  "Epigrafia",

                  "Paleografia"

                ],

                correct: 0

              },

              {

                q: "Che cosa indica la sigla US?",

                a: [

                  "Unità Stratigrafica",

                  "Unità Storica",

                  "Uso Sociale",

                  "Unità Sito"

                ],

                correct: 0

              },

              {

                q: "La tipologia serve principalmente a:",

                a: [

                  "Classificare oggetti",

                  "Misurare monumenti",

                  "Tradurre il latino",

                  "Disegnare mappe"

                ],

                correct: 0

              }

            ];


            function root() {

              return document.getElementById(ROOT_ID);

            }


            function closePanels() {

              var panels =
                root().querySelectorAll(".studio-panel");

              panels.forEach(function (p) {

                p.classList.remove("active");

              });

            }


            function openPanel(id) {

              closePanels();

              var p =
                root().querySelector("#" + id);

              if (p) {

                p.classList.add("active");

                p.scrollIntoView({
                  behavior: "smooth",
                  block: "start"
                });

              }

            }


            function openStudio() {

              var r = root();

              if (!r) return;

              r.classList.add("arch-studio-open");

              closePanels();

              window.scrollTo(0, 0);

            }


            function closeStudio() {

              var r = root();

              if (!r) return;

              r.classList.remove("arch-studio-open");

              stopTimer();

            }


            function renderFlashcard() {

              var r = root();

              var q =
                r.querySelector("#studio-flash-question");

              var a =
                r.querySelector("#studio-flash-answer");

              var item =
                FLASHCARDS[state.flash];

              q.textContent =
                state.flashBack
                  ? item[1]
                  : item[0];

              a.textContent =
                state.flashBack
                  ? "Tocca per vedere la domanda"
                  : "Tocca per vedere la risposta";

            }


            function renderQuiz() {

              var r = root();

              var q =
                r.querySelector("#studio-quiz-content");

              var item =
                QUIZ[state.quiz];

              if (!item) {

                q.innerHTML =
                  "<h3>Quiz terminato</h3>" +
                  "<p>Punteggio: <strong>" +
                  state.score +
                  " / " +
                  QUIZ.length +
                  "</strong></p>" +
                  "<button class=\"studio-button\" " +
                  "data-action=\"quiz-reset\">" +
                  "Ricomincia quiz" +
                  "</button>";

                return;

              }


              var html =
                "<div class=\"quiz-question\">" +
                (state.quiz + 1) +
                ". " +
                item.q +
                "</div>";


              item.a.forEach(function (answer, i) {

                html +=
                  "<button class=\"quiz-option\" " +
                  "data-action=\"quiz-answer\" " +
                  "data-index=\"" +
                  i +
                  "\">" +
                  answer +
                  "</button>";

              });


              q.innerHTML = html;

            }


            function saveNotes() {

              var value =
                root()
                  .querySelector("#studio-notes")
                  .value;

              localStorage.setItem(
                "archeologiaHubStudioNotes",
                value
              );

              alert("Appunti salvati.");

            }


            function loadNotes() {

              var value =
                localStorage.getItem(
                  "archeologiaHubStudioNotes"
                ) || "";

              root()
                .querySelector("#studio-notes")
                .value = value;

            }


            function startTimer() {

              if (state.timer) return;

              state.timer =
                setInterval(function () {

                  if (state.seconds <= 0) {

                    stopTimer();

                    alert("Sessione terminata.");

                    return;

                  }

                  state.seconds--;

                  renderTimer();

                }, 1000);

            }


            function stopTimer() {

              if (state.timer) {

                clearInterval(state.timer);

                state.timer = null;

              }

            }


            function resetTimer() {

              stopTimer();

              state.seconds = 1500;

              renderTimer();

            }


            function renderTimer() {

              var r = root();

              var min =
                Math.floor(
                  state.seconds / 60
                );

              var sec =
                state.seconds % 60;

              r.querySelector(
                "#studio-timer"
              ).textContent =
                String(min).padStart(2, "0") +
                ":" +
                String(sec).padStart(2, "0");

            }


            function handleAction(button) {

              var action =
                button.getAttribute("data-action");


              if (action === "close") {

                closeStudio();

                return;

              }


              if (action === "notes") {

                openPanel("studio-panel-notes");

                loadNotes();

                return;

              }


              if (action === "flash") {

                openPanel("studio-panel-flash");

                renderFlashcard();

                return;

              }


              if (action === "flash-flip") {

                state.flashBack =
                  !state.flashBack;

                renderFlashcard();

                return;

              }


              if (action === "flash-next") {

                state.flash =
                  (state.flash + 1) %
                  FLASHCARDS.length;

                state.flashBack = false;

                renderFlashcard();

                return;

              }


              if (action === "quiz") {

                state.quiz = 0;

                state.score = 0;

                openPanel("studio-panel-quiz");

                renderQuiz();

                return;

              }


              if (action === "quiz-answer") {

                var index =
                  Number(
                    button.getAttribute(
                      "data-index"
                    )
                  );

                if (
                  index ===
                  QUIZ[state.quiz].correct
                ) {

                  state.score++;

                }

                state.quiz++;

                renderQuiz();

                return;

              }


              if (action === "quiz-reset") {

                state.quiz = 0;

                state.score = 0;

                renderQuiz();

                return;

              }


              if (action === "timer") {

                openPanel("studio-panel-timer");

                renderTimer();

                return;

              }


                if (action === "timer-start") {

            TIMER_START();

            return;

          }


          if (action === "timer-pause") {

            TIMER_PAUSE();

            return;

          }


          if (action === "timer-reset") {

            TIMER_RESET();

            return;

          }


          if (action === "save-notes") {

            saveNotes();

            return;

          }


          if (action === "notes") {

            openPanel("studio-panel-notes");

            renderNotes();

            return;

          }


          if (action === "note-save") {

            saveNotes();

            return;

          }


          if (action === "note-delete") {

            var index =
              Number(
                button.getAttribute(
                  "data-index"
                )
              );

            if (
              Number.isInteger(index) &&
              index >= 0 &&
              index < state.notes.length
            ) {

              state.notes.splice(
                index,
                1
              );

              saveState();

            }

            renderNotes();

            return;

          }


          if (action === "flashcard") {

            state.flashFlipped =
              !state.flashFlipped;

            renderFlashcards();

            return;

          }


          if (action === "flash-next") {

            state.flashIndex =
              (
                state.flashIndex + 1
              ) %
              FLASHCARDS.length;

            state.flashFlipped =
              false;

            renderFlashcards();

            return;

          }


          if (action === "flash-prev") {

            state.flashIndex =
              (
                state.flashIndex -
                1 +
                FLASHCARDS.length
              ) %
              FLASHCARDS.length;

            state.flashFlipped =
              false;

            renderFlashcards();

            return;

          }


          if (action === "progress") {

            openPanel(
              "studio-panel-progress"
            );

            renderProgress();

            return;

          }


          if (action === "exam-mode") {

            openPanel(
              "studio-panel-exam"
            );

            renderExamMode();

            return;

          }


          if (action === "search") {

            openPanel(
              "studio-panel-search"
            );

            renderSearch();

            return;

          }


          if (action === "home") {

            openPanel(
              "studio-panel-home"
            );

            renderHome();

            return;

          }


          if (action === "close") {

            CLOSE_STUDIO();

            return;

          }

              }

          ROOT.addEventListener(
            "click",
            HANDLE_CLICK,
            true
          );


          window.openArcheologiaStudio =
            function(){

              OPEN_STUDIO();

            };


          window.closeArcheologiaStudio =
            function(){

              CLOSE_STUDIO();

            };


          window.ARCH_STUDIO_OPEN =
            window.openArcheologiaStudio;


          window.ARCH_STUDIO_CLOSE =
            window.closeArcheologiaStudio;


          })();

          EOF

          test -s \
            /tmp/studio-v31.js

          echo "MOTORE STUDIO V31 CREATO."

          EOF

          test -s \
            /tmp/studio-v31.js

          echo "MOTORE STUDIO V31 CREATO."


      - name: Integra Centro Studio V31
        shell: bash
        run: |
          set -e

          HTML="ArcheologiaHubAndroid/app/src/main/assets/index.html"

          test -f "$HTML"

          python3 - <<'PY'
          from pathlib import Path

          html_path = Path(
              "ArcheologiaHubAndroid/app/src/main/assets/index.html"
          )

          css_path = Path(
              "/tmp/studio-v31/studio.css"
          )

          js_path = Path(
              "/tmp/studio-v31.js"
          )

          html = html_path.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          css = css_path.read_text(
              encoding="utf-8"
          )

          js = js_path.read_text(
              encoding="utf-8"
          )

          css_marker_start = (
              '<style data-archeologia-v31-css="1">'
          )

          js_marker_start = (
              '<script data-archeologia-v31="1">'
          )

          while True:

              start = html.find(
                  css_marker_start
              )

              if start == -1:
                  break

              end = html.find(
                  "</style>",
                  start
              )

              if end == -1:
                  break

              end += len("</style>")

              html = (
                  html[:start]
                  + html[end:]
              )

          while True:

              start = html.find(
                  js_marker_start
              )

              if start == -1:
                  break

              end = html.find(
                  "</script>",
                  start
              )

              if end == -1:
                  break

              end += len("</script>")

              html = (
                  html[:start]
                  + html[end:]
              )

          css_block = (
              '<style data-archeologia-v31-css="1">\n'
              + css
              + '\n</style>'
          )

          js_block = (
              '<script data-archeologia-v31="1">\n'
              + js
              + '\n</script>'
          )

          if "</head>" not in html:
              raise SystemExit(
                  "ERRORE: </head> non trovato"
              )

          if "</body>" not in html:
              raise SystemExit(
                  "ERRORE: </body> non trovato"
              )

          html = html.replace(
              "</head>",
              css_block
              + "\n</head>",
              1
          )

          html = html.replace(
              "</body>",
              js_block
              + "\n</body>",
              1
          )

          html_path.write_text(
              html,
              encoding="utf-8"
          )

          print(
              "Centro Studio V31 integrato."
          )
          PY

          echo "INTEGRAZIONE V31 COMPLETATA."


      - name: Correzione azione salva appunti
        shell: bash
        run: |
          set -e

          HTML="ArcheologiaHubAndroid/app/src/main/assets/index.html"

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "ArcheologiaHubAndroid/app/src/main/assets/index.html"
          )

          html = path.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          old = """if (action === "progress") {

            openPanel("studio-panel-progress");

            return;

          }"""

          new = """if (action === "progress") {

            openPanel("studio-panel-progress");

            return;

          }

          if (action === "save-notes") {

            saveNotes();

            return;

          }"""

          if (
              old in html
              and
              'action === "save-notes"'
              not in html
          ):

              html = html.replace(
                  old,
                  new,
                  1
              )

              path.write_text(
                  html,
                  encoding="utf-8"
              )

          print(
              "Controllo salva appunti completato."
          )
          PY


      - name: Verifica finale Studio V31
        shell: bash
        run: |
          set -e

          HTML="ArcheologiaHubAndroid/app/src/main/assets/index.html"

          test -s "$HTML"

          grep -q \
            'data-archeologia-v31="1"' \
            "$HTML"

          grep -q \
            'data-archeologia-v31-css="1"' \
            "$HTML"

          grep -q \
            'arch-studio-v31' \
            "$HTML"

          grep -q \
            'openArcheologiaStudio' \
            "$HTML"

          grep -q \
            'closeArcheologiaStudio' \
            "$HTML"

          grep -q \
            'save-notes' \
            "$HTML"

          echo "STUDIO V31 VERIFICATO."


      - name: Controllo struttura Android
        shell: bash
        run: |
          set -e

         test -f ArcheologiaHubAndroid/app/build.gradle

          test -d \
            ArcheologiaHubAndroid/app

          test -f \
            ArcheologiaHubAndroid/app/src/main/assets/index.html

          echo "STRUTTURA ANDROID OK."


      - name: Build APK
        shell: bash
        run: |
          set -e

          cd ArcheologiaHubAndroid

          gradle \
         :app:assembleDebug \
         --no-daemon \
         --stacktrace


      - name: Verifica APK
        shell: bash
        run: |
          set -e

          APK="ArcheologiaHubAndroid/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          test -s "$APK"

          ls -lh "$APK"

          echo "APK DEBUG CREATO CORRETTAMENTE."


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Archeologia-Hub-V31-APK
          path: |
            ArcheologiaHubAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
