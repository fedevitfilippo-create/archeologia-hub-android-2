name: Build Archeologia Hub V30

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:

    name: Compila Archeologia Hub V30

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # JAVA
      # =====================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =====================================================
      # GRADLE
      # =====================================================

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # =====================================================
      # ESTRAI PROGETTO V22
      # =====================================================

      - name: Estrai progetto Archeologia Hub
        shell: bash
        run: |

          set -e

          ZIP="Archeologia_Hub_V22_PREMIUM_UI.zip"

          echo "======================================"
          echo "CONTROLLO ARCHIVIO"
          echo "======================================"

          if [ ! -f "$ZIP" ]; then

            echo "ERRORE: archivio non trovato:"
            echo "$ZIP"

            echo ""
            echo "File disponibili:"
            ls -lah

            exit 1

          fi

          rm -rf ArcheologiaHubAndroid

          unzip -q -o "$ZIP"

          echo ""
          echo "PROGETTO ESTRATTO"


      # =====================================================
      # CONTROLLO PROGETTO
      # =====================================================

      - name: Controlla progetto
        shell: bash
        run: |

          set -e

          test -f ArcheologiaHubAndroid/settings.gradle
          test -f ArcheologiaHubAndroid/app/build.gradle
          test -f ArcheologiaHubAndroid/app/src/main/AndroidManifest.xml
          test -f ArcheologiaHubAndroid/app/src/main/java/it/archeologia/hub/MainActivity.java
          test -f ArcheologiaHubAndroid/app/src/main/assets/index.html

          echo ""
          echo "======================================"
          echo "PROGETTO VERIFICATO"
          echo "======================================"


      # =====================================================
      # V29 — CORREZIONI ESISTENTI
      # =====================================================

      - name: Correzioni V29
        shell: bash
        run: |

          set -e

          python3 <<'PY'

          from pathlib import Path
          import re

          path = Path(
              "ArcheologiaHubAndroid/app/src/main/assets/index.html"
          )

          html = path.read_text(
              encoding="utf-8",
              errors="ignore"
          )


          # =================================================
          # FIX NAVIGAZIONE ORIGINALE
          # =================================================

          new_open_selected = """
          function v13OpenSelected(page){

            if(!page)return;

            try{

              if(typeof hubExamId==='undefined' || !hubExamId){

                if(
                  typeof db!=='undefined' &&
                  db &&
                  Array.isArray(db.exams) &&
                  db.exams.length
                ){

                  hubExamId=Number(db.exams[0].id);

                  localStorage.setItem(
                    'archeologiaHub.activeExam',
                    String(hubExamId)
                  );

                }

              }

              go(page);

              if(typeof hubAfterPage==='function'){

                setTimeout(function(){

                  hubAfterPage(page);

                },30);

              }

            }catch(error){

              console.error(
                'Errore apertura Area Studio:',
                error
              );

            }

          }
          """.strip()


          pattern = re.compile(
              r"function\s+v13OpenSelected\s*\(\s*page\s*\)\s*\{.*?\n\}",
              re.S
          )

          match = pattern.search(html)


          if match:

              html = (
                  html[:match.start()]
                  + new_open_selected
                  + html[match.end():]
              )

              print(
                  "FIX v13OpenSelected: OK"
              )

          else:

              print(
                  "v13OpenSelected non trovata."
              )


          # =================================================
          # FIX HIDDEN
          # =================================================

          hidden_fix = """

          /* V29 FIX — hidden ebook panels */

          .v15-ebook-shell [hidden],
          .v15-ebook-shell[hidden],
          .v15-ebook-library[hidden],
          .v15-ebook-reader[hidden],
          .v15-ebook-editor[hidden]{

            display:none!important;
            visibility:hidden!important;
            pointer-events:none!important;

          }

          [hidden]{

            display:none!important;

          }

          """


          if "V29 FIX — hidden ebook panels" not in html:

              pos = html.lower().rfind("</style>")

              if pos >= 0:

                  html = (
                      html[:pos]
                      + hidden_fix
                      + "\n"
                      + html[pos:]
                  )

              else:

                  pos = html.lower().find("</head>")

                  if pos >= 0:

                      html = (
                          html[:pos]
                          + "<style>"
                          + hidden_fix
                          + "</style>"
                          + "\n"
                          + html[pos:]
                      )

                  else:

                      raise SystemExit(
                          "Impossibile inserire CSS V29."
                      )


          # =================================================
          # FIX PULSANTI EBOOK
          # =================================================

          button_fix = """

          /* V29 — ebook controls always clickable */

          .v15-ebook-shell button{

            position:relative;
            z-index:5;
            pointer-events:auto;
            touch-action:manipulation;

          }

          .v15-ebook-shell input,
          .v15-ebook-shell textarea{

            pointer-events:auto;
            touch-action:auto;

          }

          """


          if "V29 — ebook controls always clickable" not in html:

              pos = html.lower().rfind("</style>")

              if pos >= 0:

                  html = (
                      html[:pos]
                      + button_fix
                      + "\n"
                      + html[pos:]
                  )


          path.write_text(
              html,
              encoding="utf-8"
          )

          print("")
          print("======================================")
          print("FIX V29 APPLICATI")
          print("======================================")

          PY


      # =====================================================
      # V30 — CENTRO STUDIO COMPLETAMENTE SEPARATO
      # DAGLI ESAMI
      # =====================================================

      - name: Crea Centro Studio V30 indipendente
        shell: bash
        run: |

          set -e

          python3 <<'PY'

          from pathlib import Path

          path = Path(
              "ArcheologiaHubAndroid/app/src/main/assets/index.html"
          )

          html = path.read_text(
              encoding="utf-8",
