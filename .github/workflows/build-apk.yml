name: Build Archeologia Hub V28

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compila Archeologia Hub V28
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # JAVA 17
      # =========================================================
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # GRADLE 8.7
      # =========================================================
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # =========================================================
      # ESTRAZIONE PROGETTO V22
      # =========================================================
      - name: Estrai V22
        shell: bash
        run: |
          set -e

          ZIP="Archeologia_Hub_V22_PREMIUM_UI.zip"

          echo "=========================================="
          echo "CONTROLLO ZIP"
          echo "=========================================="

          ls -lah

          if [ ! -f "$ZIP" ]; then
            echo "ERRORE: $ZIP non trovato."
            echo ""
            echo "File presenti nella root:"
            find . -maxdepth 1 -type f -printf '%f\n'
            exit 1
          fi

          echo "ZIP trovato: $ZIP"

          rm -rf ArcheologiaHubAndroid

          unzip -q -o "$ZIP"

          echo ""
          echo "Progetto estratto:"
          find ArcheologiaHubAndroid -maxdepth 5 -type f | sort

      # =========================================================
      # CONTROLLO PROGETTO
      # =========================================================
      - name: Controlla progetto
        shell: bash
        run: |
          set -e

          echo "Controllo file fondamentali..."

          test -f ArcheologiaHubAndroid/settings.gradle
          test -f ArcheologiaHubAndroid/app/build.gradle
          test -f ArcheologiaHubAndroid/app/src/main/AndroidManifest.xml
          test -f ArcheologiaHubAndroid/app/src/main/java/it/archeologia/hub/MainActivity.java
          test -f ArcheologiaHubAndroid/app/src/main/assets/index.html

          test -f features/study.js
          test -f features/study.css

          echo ""
          echo "=========================================="
          echo "PROGETTO V22 OK"
          echo "=========================================="

      # =========================================================
      # COPIA STUDY ENGINE
      # =========================================================
      - name: Copia Study Engine
        shell: bash
        run: |
          set -e

          ASSETS="ArcheologiaHubAndroid/app/src/main/assets"

          echo "Copio Study Engine..."

          cp features/study.js "$ASSETS/study.js"
          cp features/study.css "$ASSETS/study.css"

          echo "Study Engine copiato."

      # =========================================================
      # INTEGRA STUDY ENGINE + CORREZIONE V28
      # =========================================================
      - name: Correggi Area Studio V28
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "ArcheologiaHubAndroid/app/src/main/assets/index.html"
          )

          html = path.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          # -----------------------------------------------------
          # Assicura che study.css e study.js siano presenti
          # -----------------------------------------------------

          css_tag = '<link rel="stylesheet" href="study.css">'
          js_tag = '<script src="study.js"></script>'

          if "study.css" not in html:
              pos = html.lower().find("</head>")
              if pos >= 0:
                  html = html[:pos] + css_tag + "\n" + html[pos:]

          if 'src="study.js"' not in html:
              pos = html.lower().rfind("</body>")
              if pos >= 0:
                  html = html[:pos] + js_tag + "\n" + html[pos:]

          # -----------------------------------------------------
          # V28:
          # sostituisce esclusivamente v13OpenSelected()
          #
          # Il vecchio comportamento era:
          #
          # if(!sel.length){
          #     go('hubTimetable');
          #     return;
          # }
          #
          # Questo faceva finire Appunti / Audio / Riassunti /
          # Schemi nell'Orario se non era selezionato un esame.
          # -----------------------------------------------------

          new_function = r"""
          function v13OpenSelected(page){
            if(!page)return;

            if(typeof hubExamId==='undefined' || !hubExamId){
              const first=
                (typeof db!=='undefined' &&
                 db &&
                 Array.isArray(db.exams) &&
                 db.exams.length)
                ? db.exams[0]
                : null;

              if(first){
                hubExamId=Number(first.id);
                localStorage.setItem(
                  'archeologiaHub.activeExam',
                  String(hubExamId)
                );
              }
            }

            go(page);
            hubAfterPage(page);
          }
          """.strip()

          # Cerca la funzione completa fino alla funzione successiva.
          pattern = re.compile(
              r"function\s+v13OpenSelected\s*\(page\)\s*\{.*?\n\}",
              re.S
          )

          if pattern.search(html):
              html, count = pattern.subn(
                  new_function,
                  html,
                  count=1
              )

              print(
                  "v13OpenSelected() sostituita:",
                  count
              )

          else:
              print(
                  "ATTENZIONE: v13OpenSelected() non trovata."
              )

              # Inserisce la funzione prima di v13OpenSearch
              marker = "function v13OpenSearch"

              if marker in html:
                  html = html.replace(
                      marker,
                      new_function +
                      "\n\n" +
                      marker,
                      1
                  )
                  print(
                      "v13OpenSelected() inserita prima di v13OpenSearch."
                  )
              else:
                  raise SystemExit(
                      "ERRORE: impossibile trovare il punto di inserimento."
                  )

          # -----------------------------------------------------
          # Controlli finali
          # -----------------------------------------------------

          if "function v13OpenSelected(page)" not in html:
              raise SystemExit(
                  "ERRORE: funzione V28 non presente."
              )

          if "go('hubTimetable');return;" in html:
              print(
                  "Nota: trovata un'altra occorrenza del vecchio "
                  "fallback all'Orario; verificare manualmente."
              )

          path.write_text(
              html,
              encoding="utf-8"
          )

          print("")
          print("==========================================")
          print("AREA STUDIO V28 CORRETTA")
          print("==========================================")
          PY

      # =========================================================
      # VERIFICA CORREZIONE
      # =========================================================
      - name: Verifica integrazione V28
        shell: bash
        run: |
          set -e

          FILE="ArcheologiaHubAndroid/app/src/main/assets/index.html"

          echo "Controllo presenza funzione V28..."

          grep -n "function v13OpenSelected" "$FILE"

          echo ""
          echo "Controllo moduli Studio..."

          grep -n "hubNotes" "$FILE" | head -5 || true
          grep -n "hubAudio" "$FILE" | head -5 || true
          grep -n "hubSummaries" "$FILE" | head -5 || true
          grep -n "hubSchemes" "$FILE" | head -5 || true

          echo ""
          echo "=========================================="
          echo "VERIFICA V28 COMPLETATA"
          echo "=========================================="

      # =========================================================
      # VERIFICA GRADLE
      # =========================================================
      - name: Verifica Gradle
        working-directory: ArcheologiaHubAndroid
        shell: bash
        run: |
          set -e

          echo "Versione Gradle:"
          gradle --version

          echo ""
          echo "Verifica task Gradle..."

          gradle tasks --no-daemon --stacktrace

      # =========================================================
      # CLEAN
      # =========================================================
      - name: Clean
        working-directory: ArcheologiaHubAndroid
        shell: bash
        run: |
          set -e

          echo "Pulizia build precedente..."

          gradle clean \
            --no-daemon \
            --stacktrace

      # =========================================================
      # COMPILAZIONE APK
      # =========================================================
      - name: Compila APK V28
        working-directory: ArcheologiaHubAndroid
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "COMPILAZIONE ARCHEOLOGIA HUB V28"
          echo "=========================================="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Build completata."

      # =========================================================
      # VERIFICA APK
      # =========================================================
      - name: Verifica APK
        shell: bash
        run: |
          set -e

          APK="ArcheologiaHubAndroid/app/build/outputs/apk/debug/app-debug.apk"

          echo "Controllo APK..."

          if [ ! -f "$APK" ]; then
            echo ""
            echo "=========================================="
            echo "ERRORE: APK NON GENERATO"
            echo "=========================================="

            echo ""
            echo "File trovati nella build:"
            find ArcheologiaHubAndroid/app/build \
              -type f \
              | sort || true

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "APK GENERATO CORRETTAMENTE"
          echo "=========================================="

          ls -lh "$APK"

      # =========================================================
      # UPLOAD APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Archeologia-Hub-V28-APK
          path: ArcheologiaHubAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # COMPLETATO
      # =========================================================
      - name: Build completata
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "        ARCHEOLOGIA HUB V28"
          echo "=========================================="
          echo ""
          echo "BUILD: OK"
          echo "APK: OK"
          echo "STUDY ENGINE: OK"
          echo "AREA STUDIO: CORRETTA"
          echo "=========================================="
