name: Build Archeologia Hub V27

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compila Archeologia Hub V27
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Estrai progetto V22
        shell: bash
        run: |
          set -e

          ZIP="Archeologia_Hub_V22_PREMIUM_UI.zip"

          echo "Controllo archivio..."
          test -f "$ZIP"

          rm -rf ArcheologiaHubAndroid

          unzip -q -o "$ZIP"

          echo "Progetto estratto."

      - name: Controlla progetto
        shell: bash
        run: |
          set -e

          test -f ArcheologiaHubAndroid/settings.gradle
          test -f ArcheologiaHubAndroid/app/build.gradle
          test -f ArcheologiaHubAndroid/app/src/main/AndroidManifest.xml
          test -f ArcheologiaHubAndroid/app/src/main/java/it/archeologia/hub/MainActivity.java
          test -f ArcheologiaHubAndroid/app/src/main/assets/index.html

          echo "Struttura progetto OK."

      - name: Correggi Area Studio V27
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "ArcheologiaHubAndroid/app/src/main/assets/index.html"
          )

          html = path.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          start_marker = "function v14RenderStudy(){"
          end_marker = "const v14OldRender=render;"

          start = html.find(start_marker)
          end = html.find(end_marker, start)

          if start < 0:
              raise SystemExit(
                  "ERRORE: funzione v14RenderStudy non trovata."
              )

          if end < 0:
              raise SystemExit(
                  "ERRORE: fine v14RenderStudy non trovata."
              )

          new_function = """
          function v14RenderStudy(){
            const sec=document.getElementById('study');

            if(!sec)return;

            const old=sec.querySelector('.v14-study-landing');

            if(old)old.remove();

            const wrap=document.createElement('div');

            wrap.className='v14-study-landing';

            const courses =
              (typeof db !== 'undefined' &&
               db &&
               Array.isArray(db.exams))
              ? db.exams
              : [];

            wrap.innerHTML = `
              <div class="v14-study-landing-hero">

                <span
                  class="v14-overline"
                  style="color:#e4c99d"
                >
                  AREA STUDIO
                </span>

                <h2>Centro Studio</h2>

                <p>
                  Il tuo spazio universitario per appunti,
                  materiali, audio, riassunti e ripasso.
                </p>

              </div>

              <div class="v14-study-tools">

                <button
                  type="button"
                  onclick="v13OpenSelected('hubNotes')"
                >
                  <b>📝 Appunti</b>
                  <small>Scrivi e organizza</small>
                </button>

                <button
                  type="button"
                  onclick="v13OpenSelected('hubAudio')"
                >
                  <b>🎧 Audio</b>
                  <small>Ascolta le lezioni</small>
                </button>

                <button
                  type="button"
                  onclick="v13OpenSelected('hubSummaries')"
                >
                  <b>▤ Riassunti</b>
                  <small>Ripassa</small>
                </button>

                <button
                  type="button"
                  onclick="v13OpenSelected('hubSchemes')"
                >
                  <b>⌘ Schemi</b>
                  <small>Collega concetti</small>
                </button>

                <button
                  type="button"
                  onclick="v13OpenSelected('hubMaterials')"
                >
                  <b>📂 Materiali</b>
                  <small>Documenti e file</small>
                </button>

                <button
                  type="button"
                  onclick="v13OpenSelected('hubPhotos')"
                >
                  <b>📷 Foto</b>
                  <small>Immagini dello studio</small>
                </button>

                <button
                  type="button"
                  onclick="v13OpenSelected('hubReadListen')"
                >
                  <b>📖 Leggi</b>
                  <small>Leggi e ascolta</small>
                </button>

                <button
                  type="button"
                  onclick="go('stats')"
                >
                  <b>📊 Progressi</b>
                  <small>Controlla lo studio</small>
                </button>

              </div>

              <div class="v15-study-personal">

                <div class="v14-section-head">

                  <div>

                    <span class="v14-overline">
                      ORGANIZZAZIONE
                    </span>

                    <h3>Il tuo studio</h3>

                  </div>

                </div>

                <div class="v15-personal-grid">

                  <button
                    type="button"
                    onclick="addItem('notes')"
                  >
                    <b>✎ Nuovo appunto</b>

                    <small>
                      Annota una lezione o un concetto
                    </small>
                  </button>

                  <button
                    type="button"
                    onclick="addItem('sessions')"
                  >
                    <b>◷ Sessione</b>

                    <small>
                      Registra il tempo di studio
                    </small>
                  </button>

                  <button
                    type="button"
                    onclick="addItem('tasks')"
                  >
                    <b>✓ Attività</b>

                    <small>
                      Organizza ciò che devi fare
                    </small>
                  </button>

                </div>

              </div>

              <div
                class="v14-section"
                style="margin-top:14px"
              >

                <div class="v14-section-head">

                  <div>

                    <span class="v14-overline">
                      CORSI
                    </span>

                    <h3>
                      Cartelle degli insegnamenti
                    </h3>

                  </div>

                </div>

                <div class="v14-study-exams">

                  ${
                    courses.length
                    ? courses.map(x => `

                      <button
                        type="button"
                        class="v14-study-exam"
                        onclick="hubOpenExam(${Number(x.id)})"
                      >

                        <span>📚</span>

                        <div>

                          <b>
                            ${typeof esc === 'function'
                              ? esc(x.name)
                              : x.name}
                          </b>

                          <small>
                            ${
                              x.cfu
                              ? x.cfu + ' CFU'
                              : 'Idoneità'
                            }
                            · Apri cartella di studio
                          </small>

                        </div>

                        <span>›</span>

                      </button>

                    `).join('')

                    : `

                      <div class="v15-empty">
                        Nessun insegnamento disponibile.
                      </div>

                    `
                  }

                </div>

              </div>
            `;

            sec.prepend(wrap);
          }
          """

          html = (
              html[:start]
              + new_function
              + "\n"
              + html[end:]
          )

          path.write_text(
              html,
              encoding="utf-8"
          )

          print("Area Studio V27 integrata correttamente.")
          PY

      - name: Controllo JavaScript
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "ArcheologiaHubAndroid/app/src/main/assets/index.html"
          )

          html = path.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          if "function v14RenderStudy(){" not in html:
              raise SystemExit(
                  "ERRORE: v14RenderStudy non presente."
              )

          if "Centro Studio" not in html:
              raise SystemExit(
                  "ERRORE: Centro Studio non presente."
              )

          if "Cartelle degli insegnamenti" not in html:
              raise SystemExit(
                  "ERRORE: sezione corsi non presente."
              )

          print("Controllo JavaScript OK.")
          PY

      - name: Verifica progetto finale
        shell: bash
        run: |
          set -e

          test -f ArcheologiaHubAndroid/settings.gradle
          test -f ArcheologiaHubAndroid/app/build.gradle
          test -f ArcheologiaHubAndroid/app/src/main/AndroidManifest.xml
          test -f ArcheologiaHubAndroid/app/src/main/java/it/archeologia/hub/MainActivity.java
          test -f ArcheologiaHubAndroid/app/src/main/assets/index.html

          echo "Progetto finale verificato."

      - name: Build APK
        working-directory: ArcheologiaHubAndroid
        shell: bash
        run: |
          set -e

          echo "Pulizia..."
          gradle clean --no-daemon

          echo "Compilazione APK V27..."
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verifica APK
        shell: bash
        run: |
          set -e

          APK="ArcheologiaHubAndroid/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRORE: APK non generato."
            exit 1
          fi

          echo "======================================"
          echo "APK V27 GENERATO CORRETTAMENTE"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK V27
        uses: actions/upload-artifact@v4
        with:
          name: Archeologia-Hub-V27-APK
          path: ArcheologiaHubAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
