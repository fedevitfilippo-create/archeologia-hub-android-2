name: Build Archeologia Hub V29

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compila Archeologia Hub V29
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # JAVA
      # =====================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =====================================================
      # GRADLE
      # =====================================================

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # =====================================================
      # ESTRAI PROGETTO V22
      # =====================================================

      - name: Estrai progetto V22
        shell: bash
        run: |
          set -e

          ZIP="Archeologia_Hub_V22_PREMIUM_UI.zip"

          echo "Controllo archivio..."

          if [ ! -f "$ZIP" ]; then
            echo "ERRORE: archivio non trovato:"
            echo "$ZIP"
            echo ""
            echo "File presenti:"
            ls -lah
            exit 1
          fi

          rm -rf ArcheologiaHubAndroid

          unzip -q -o "$ZIP"

          echo ""
          echo "Progetto estratto correttamente."

      # =====================================================
      # CONTROLLO PROGETTO
      # =====================================================

      - name: Controlla progetto
        shell: bash
        run: |
          set -e

          test -f ArcheologiaHubAndroid/settings.gradle
          test -f ArcheologiaHubAndroid/app/build.gradle
          test -f ArcheologiaHubAndroid/app/src/main/AndroidManifest.xml
          test -f ArcheologiaHubAndroid/app/src/main/java/it/archeologia/hub/MainActivity.java
          test -f ArcheologiaHubAndroid/app/src/main/assets/index.html

          echo ""
          echo "======================================"
          echo "PROGETTO V22 VERIFICATO"
          echo "======================================"

      # =====================================================
      # CORREZIONI V29
      # =====================================================

      - name: Correggi navigazione e interfaccia V29
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "ArcheologiaHubAndroid/app/src/main/assets/index.html"
          )

          html = path.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          # =================================================
          # FIX 1
          # v13OpenSelected non deve mandare all'Orario
          # =================================================

          new_open_selected = """
          function v13OpenSelected(page){
            if(!page)return;

            try{
              if(typeof hubExamId==='undefined' || !hubExamId){

                if(
                  typeof db!=='undefined' &&
                  db &&
                  Array.isArray(db.exams) &&
                  db.exams.length
                ){
                  hubExamId=Number(db.exams[0].id);

                  localStorage.setItem(
                    'archeologiaHub.activeExam',
                    String(hubExamId)
                  );
                }
              }

              go(page);

              if(typeof hubAfterPage==='function'){
                setTimeout(function(){
                  hubAfterPage(page);
                },30);
              }

            }catch(error){
              console.error(
                'Errore apertura Area Studio:',
                error
              );
            }
          }
          """.strip()

          pattern = re.compile(
              r"function\s+v13OpenSelected\s*\(\s*page\s*\)\s*\{.*?\n\}",
              re.S
          )

          match = pattern.search(html)

          if match:
              html = (
                  html[:match.start()]
                  + new_open_selected
                  + html[match.end():]
              )

              print(
                  "FIX v13OpenSelected: OK"
              )
          else:
              print(
                  "ATTENZIONE: v13OpenSelected non trovata."
              )

          # =================================================
          # FIX 2
          # hidden deve SEMPRE vincere sul display:flex
          #
          # Questo è il fix principale del problema visto
          # nel video.
          # =================================================

          hidden_fix = """
          /* V29 FIX — hidden ebook panels */
          .v15-ebook-shell [hidden],
          .v15-ebook-shell[hidden],
          .v15-ebook-library[hidden],
          .v15-ebook-reader[hidden],
          .v15-ebook-editor[hidden]{
            display:none!important;
            visibility:hidden!important;
            pointer-events:none!important;
          }

          /* Evita che pannelli ebook nascosti
             intercettino i tocchi */
          [hidden]{
            display:none!important;
          }
          """

          # Inseriamo il fix alla fine dello style document.
          if "V29 FIX — hidden ebook panels" not in html:

              pos = html.lower().rfind("</style>")

              if pos >= 0:
                  html = (
                      html[:pos]
                      + hidden_fix
                      + "\n"
                      + html[pos:]
                  )

                  print(
                      "FIX hidden ebook: OK"
                  )

              else:
                  # Fallback: inserimento nell'head
                  pos = html.lower().find("</head>")

                  if pos >= 0:
                      html = (
                          html[:pos]
                          + "<style>"
                          + hidden_fix
                          + "</style>"
                          + "\n"
                          + html[pos:]
                      )

                      print(
                          "FIX hidden ebook inserito nell'head."
                      )
                  else:
                      raise SystemExit(
                          "ERRORE: impossibile inserire CSS V29."
                      )

          # =================================================
          # FIX 3
          # Assicura che i pulsanti ebook abbiano priorità
          # =================================================

          button_fix = """
          /* V29 — ebook controls always clickable */
          .v15-ebook-shell button{
            position:relative;
            z-index:5;
            pointer-events:auto;
            touch-action:manipulation;
          }

          .v15-ebook-shell input,
          .v15-ebook-shell textarea{
            pointer-events:auto;
            touch-action:auto;
          }
          """

          if "V29 — ebook controls always clickable" not in html:

              pos = html.lower().rfind("</style>")

              if pos >= 0:
                  html = (
                      html[:pos]
                      + button_fix
                      + "\n"
                      + html[pos:]
                  )

          # =================================================
          # SALVA
          # =================================================

          path.write_text(
              html,
              encoding="utf-8"
          )

          print("")
          print("======================================")
          print("CORREZIONI V29 APPLICATE")
          print("======================================")
          PY

      # =====================================================
      # VERIFICA FIX
      # =====================================================

      - name: Verifica correzioni V29
        shell: bash
        run: |
          set -e

          FILE="ArcheologiaHubAndroid/app/src/main/assets/index.html"

          echo "Controllo v13OpenSelected..."

          grep -q "function v13OpenSelected" "$FILE"

          echo "OK"

          echo ""
          echo "Controllo fix hidden..."

          grep -q "V29 FIX — hidden ebook panels" "$FILE"

          echo "OK"

          echo ""
          echo "Controllo fix pulsanti..."

          grep -q "V29 — ebook controls always clickable" "$FILE"

          echo "OK"

          echo ""
          echo "======================================"
          echo "TUTTI I FIX V29 PRESENTI"
          echo "======================================"

      # =====================================================
      # VERIFICA GRADLE
      # =====================================================

      - name: Verifica Gradle
        working-directory: ArcheologiaHubAndroid
        shell: bash
        run: |
          set -e

          gradle tasks \
            --no-daemon \
            --stacktrace

      # =====================================================
      # CLEAN
      # =====================================================

      - name: Clean
        working-directory: ArcheologiaHubAndroid
        shell: bash
        run: |
          set -e

          gradle clean \
            --no-daemon \
            --stacktrace

      # =====================================================
      # BUILD
      # =====================================================

      - name: Compila APK V29
        working-directory: ArcheologiaHubAndroid
        shell: bash
        run: |
          set -e

          echo ""
          echo "======================================"
          echo "COMPILAZIONE ARCHEOLOGIA HUB V29"
          echo "======================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      # =====================================================
      # VERIFICA APK
      # =====================================================

      - name: Verifica APK
        shell: bash
        run: |
          set -e

          APK="ArcheologiaHubAndroid/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

            echo ""
            echo "======================================"
            echo "ERRORE: APK NON GENERATO"
            echo "======================================"

            find ArcheologiaHubAndroid/app/build \
              -type f \
              | sort || true

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK V29 GENERATO"
          echo "======================================"

          ls -lh "$APK"

      # =====================================================
      # ARTIFACT
      # =====================================================

      - name: Upload APK V29
        uses: actions/upload-artifact@v4
        with:
          name: Archeologia-Hub-V29-APK
          path: ArcheologiaHubAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # =====================================================
      # FINE
      # =====================================================

      - name: Build completata
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo " ARCHEOLOGIA HUB V29"
          echo "======================================"
          echo " BUILD: OK"
          echo " NAVIGAZIONE STUDIO: OK"
          echo " EBOOK HIDDEN FIX: OK"
          echo " PULSANTI EBOOK: OK"
          echo " APK: OK"
          echo "======================================"
