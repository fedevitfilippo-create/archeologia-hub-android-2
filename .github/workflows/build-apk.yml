      # ------------------------------------------
      # COLLEGA STUDY ENGINE ALL'HTML
      # ------------------------------------------
      - name: Integra Study Engine
        shell: bash
        run: |
          set -e

          HTML="ArcheologiaHubAndroid/app/src/main/assets/index.html"

          if [ ! -f "$HTML" ]; then
            echo "ERRORE: index.html non trovato."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path

          html_path = Path(
              "ArcheologiaHubAndroid/app/src/main/assets/index.html"
          )

          html = html_path.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          css = '<link rel="stylesheet" href="study.css">'
          js = '<script src="study.js"></script>'

          # IMPORTANTISSIMO:
          # usare l'ULTIMO </head> e l'ULTIMO </body>.
          # La V22 contiene altri </head>/</body> dentro
          # stringhe JavaScript.

          if "href=\"study.css\"" not in html:
              pos = html.lower().rfind("</head>")

              if pos == -1:
                  raise SystemExit(
                      "ERRORE: tag </head> finale non trovato."
                  )

              html = (
                  html[:pos]
                  + css
                  + "\n"
                  + html[pos:]
              )

          if 'src="study.js"' not in html:
              pos = html.lower().rfind("</body>")

              if pos == -1:
                  raise SystemExit(
                      "ERRORE: tag </body> finale non trovato."
                  )

              html = (
                  html[:pos]
                  + js
                  + "\n"
                  + html[pos:]
              )

          html_path.write_text(
              html,
              encoding="utf-8"
          )

          print("Study Engine integrato correttamente.")
          PY
